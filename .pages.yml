# Painel de fotos do site (Pages CMS: https://app.pagescms.org)
# Cada item abaixo edita um arquivo em content/galerias/. Ao salvar, o GitHub Action
# "Publicar site" otimiza as fotos, atualiza as páginas e envia para a Locaweb.

media:
  input: uploads
  output: /uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: projetos
    label: "Página inicial — Projetos realizados"
    type: file
    path: content/galerias/projetos.json
    fields:
      - name: fotos
        label: Projetos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.titulo} — {fields.local}"
        fields:
          - { name: imagem, label: Foto, type: image, required: true }
          - { name: titulo, label: "Serviço (ex.: Sinalização Náutica)", type: string, required: true }
          - { name: local, label: "Local (ex.: Porto de Vitória - ES)", type: string }

  - name: clientes
    label: "Clientes — logos"
    type: file
    path: content/galerias/clientes.json
    fields:
      - name: fotos
        label: "Logos (os 6 primeiros também aparecem na página inicial)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.nome}"
        fields:
          - { name: imagem, label: Logo, type: image, required: true }
          - { name: nome, label: Nome do cliente, type: string, required: true }

  - name: sinalizacao-nautica
    label: "Sinalização Náutica — Operações de manutenção"
    type: file
    path: content/galerias/sinalizacao-nautica.json
    fields:
