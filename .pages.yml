      - name: fotos
        label: Fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.legenda}"
        fields:
          - { name: imagem, label: Foto, type: image, required: true }
          - { name: legenda, label: "Legenda (aparece embaixo da foto)", type: string, required: true }

