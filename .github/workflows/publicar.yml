# Publica o site na Locaweb a cada alteração na main (inclusive as feitas pelo painel de fotos).
# 1. gera as galerias (scripts/galerias.py) e versiona as fotos otimizadas;
# 2. envia por FTPS (lftp) só os arquivos que mudaram desde o último envio.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      completo:
        description: "Reenviar todos os arquivos (use no primeiro envio)"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para datar os arquivos pelo último commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar galerias
        run: |
          pip install pillow==11.0.0
          python scripts/galerias.py

      - name: Versionar fotos otimizadas e páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/galerias '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza galerias de fotos [skip ci]"
            git push
          fi

      - name: Enviar para a Locaweb
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          COMPLETO: ${{ inputs.completo }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          # cada arquivo fica com a data do último commit que o alterou; o lftp envia
          # só o que for mais novo que a cópia do servidor (que tem a data do upload)
          git ls-files -z | while IFS= read -r -d '' f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done
          [ "$COMPLETO" = "true" ] && SO_NOVOS="" || SO_NOVOS="--only-newer"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no;
            set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30;
            mirror --reverse $SO_NOVOS --no-perms --parallel=4 --log=lftp-envio.log \
              --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .pages.yml \
              --exclude-glob content/ --exclude-glob uploads/ --exclude-glob scripts/ \
              --exclude-glob *.md --exclude-glob CNAME --exclude-glob images/galerias/manifesto.json \
              --exclude-glob web.config \
              ./ /web/;
            bye"
          echo "Arquivos enviados: $(grep -c '^put' lftp-envio.log 2>/dev/null || echo 0)"
          grep '^put' lftp-envio.log 2>/dev/null | sed -E 's|.* (/web/[^ ]*)$|\1|' | head -100 || true
