# Temporário: diagnostica a conexão FTP com a Locaweb. Apagar depois.
name: Diagnóstico FTP
on: workflow_dispatch
jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: FTP simples (passivo)
        continue-on-error: true
        env: { S: "${{ secrets.FTP_SERVER }}", U: "${{ secrets.FTP_USERNAME }}", P: "${{ secrets.FTP_PASSWORD }}" }
        run: |
          echo "teste" > teste-diagnostico.txt
          timeout 90 lftp -d -u "$U,$P" "$S" -e "set ftp:ssl-allow no; set net:max-retries 1; set net:timeout 20; pwd; cls -1 | head -20; cd web; cls -1 | head -5; put teste-diagnostico.txt; rm teste-diagnostico.txt; bye" 2>&1 | grep -v "PASS" | tail -60
      - name: FTPS explícito (passivo)
        continue-on-error: true
        env: { S: "${{ secrets.FTP_SERVER }}", U: "${{ secrets.FTP_USERNAME }}", P: "${{ secrets.FTP_PASSWORD }}" }
        run: |
          echo "teste" > teste-diagnostico.txt
          timeout 90 lftp -d -u "$U,$P" "$S" -e "set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; set net:max-retries 1; set net:timeout 20; pwd; cls -1 | head -20; cd web; cls -1 | head -5; put teste-diagnostico.txt; rm teste-diagnostico.txt; bye" 2>&1 | grep -v "PASS" | tail -60
